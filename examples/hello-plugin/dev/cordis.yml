# Standalone Cordis composition for local smoke tests.
#
#   cd examples/hello-plugin/dev && node --import tsx ../../../vendor/cordis/bin.js
#
# It mounts the tool registry and its dependencies, this bundle's two plugins,
# and a development driver that executes the tool through the real pipeline.
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-tool-executor-native'
- name: 'dsh-hello-plugin'
  config:
    greeting: Hi
- name: 'dsh-hello-plugin/observer'
- name: './smoke.js'
